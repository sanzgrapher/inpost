name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # tauri-action creates the Release and attaches assets

jobs:
  build:
    # Guard against forks burning release minutes on tag pushes (Yaak pattern).
    if: github.repository == 'sanzgrapher/inpost'
    name: build (${{ matrix.os }} / ${{ matrix.target || 'native' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1+) build
          - os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          # Intel Mac build
          - os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - os: ubuntu-22.04
            target: ''
            args: ''
          - os: windows-latest
            target: ''
            args: ''

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          cache-on-failure: true

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libsoup-3.0-dev libnss3 xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Same gate sequence as local `npm run preflight`, minus the slow bundle step.
      # tauri-action runs tauri build itself and uploads the per-OS installers.
      - name: Gates (typecheck + tests + cargo build --release + MCP + frontend)
        run: npm run ci:gates
        shell: bash   # build:mcp uses cp / mkdir -p — bash ships on all 3 OS runners

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Inpost ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
